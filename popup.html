<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  body {
    width: 376px;
    padding: 11px 14px 10px;
    background: var(--bg-canvas);
    font-size: 13px;
    line-height: 1.45;
  }
  .pop-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .pop-logo {
    width: 22px;
    height: 22px;
    display: block;
    flex-shrink: 0;
  }
  .pop-title {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .existed-badge {
    margin-left: auto;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--amber-soft);
    color: var(--amber);
    font-size: 11px;
    font-weight: 600;
  }
  .existed-badge:empty {
    display: none;
  }

  .field {
    margin-bottom: 7px;
  }
  .field label {
    display: block;
    margin-bottom: 2px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .field .input,
  .field .textarea {
    padding: 5px 8px;
    font-size: 12.5px;
  }
  #url {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-secondary);
  }
  #note {
    min-height: 44px;
    max-height: 84px;
    line-height: 1.45;
  }

  #sug {
    position: relative;
  }
  #sugList {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    max-height: 140px;
    overflow-y: auto;
    display: none;
    z-index: 9;
    box-shadow: var(--shadow-md);
  }
  #sugList div {
    padding: 6px 10px;
    font-size: 12.5px;
    cursor: pointer;
  }
  #sugList div:hover,
  #sugList div.active {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  #quick {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 5px;
  }
  #quick .chip {
    padding: 1px 8px;
    font-size: 11.5px;
  }

  .pop-foot {
    position: sticky;
    bottom: 0;
    background: var(--bg-canvas);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    padding: 8px 0 2px;
    border-top: 1px solid var(--border);
  }
  #today {
    margin-left: auto;
    color: var(--text-muted);
    font-size: 11.5px;
  }
  #status {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--success);
  }
  #status:empty {
    display: none;
  }
  #status.err {
    color: var(--danger);
  }
</style>
</head>
<body>
  <div class="pop-head">
    <img class="pop-logo" src="icons/icon.svg" alt="" aria-hidden="true">
    <h3 class="pop-title">E-Deli 收藏</h3>
    <span class="existed-badge" id="existed"></span>
  </div>

  <div class="field">
    <label for="title">标题</label>
    <input class="input" id="title" placeholder="网页标题">
  </div>

  <div class="field">
    <label for="url">网址</label>
    <input class="input" id="url" placeholder="https://...">
  </div>

  <div class="field">
    <label for="tags">标签（空格或逗号分隔）</label>
    <div id="sug">
      <input class="input" id="tags" autocomplete="off" placeholder="输入标签，支持 ↑↓ 选词">
      <div id="sugList"></div>
    </div>
    <div id="quick"></div>
  </div>

  <div class="field">
    <label for="note">书摘 / 备注</label>
    <textarea class="textarea" id="note" rows="2" placeholder="可选：记录划词或个人备注"></textarea>
  </div>

  <div class="pop-foot">
    <button id="save" class="btn btn-primary">收藏</button>
    <a id="manage" href="#">打开管理页</a>
    <span id="today"></span>
  </div>
  <div id="status"></div>

  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>

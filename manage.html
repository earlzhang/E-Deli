<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Deli · 个人书签知识库</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="manage.css">
</head>
<body>
<div class="app-shell">
  <!-- 左侧知识库导航栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand-bar">
      <div class="brand">
        <img class="brand-logo" src="icons/icon.svg" alt="" aria-hidden="true">
        <div>
          <span class="brand-name">E-Deli</span>
          <span class="brand-sub">书签库</span>
        </div>
      </div>
      <button id="themeBtn" class="btn btn-ghost btn-icon" title="切换深浅色模式" aria-label="切换深浅色模式">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>

    <div class="sidebar-scroll">
      <!-- 智能视图 -->
      <div class="nav-section">
        <div class="section-head">
          <span class="section-title">智能视图</span>
        </div>
        <div class="view-list" id="viewList">
          <button class="view-item active" data-view="all">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
            <span>全部收藏</span><span class="count" id="cnt-all">0</span>
          </button>
          <button class="view-item" data-view="today">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span>今日新增</span><span class="count" id="cnt-today">0</span>
          </button>
          <button class="view-item" data-view="week">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span>本周收藏</span><span class="count" id="cnt-week">0</span>
          </button>
          <button class="view-item" data-view="wx">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>公众号文章</span><span class="count" id="cnt-wx">0</span>
          </button>
          <button class="view-item" data-view="noted">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <span>含书摘备注</span><span class="count" id="cnt-noted">0</span>
          </button>
          <button class="view-item" data-view="untagged">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            <span>未打标签</span><span class="count" id="cnt-untagged">0</span>
          </button>
        </div>
      </div>

      <!-- 快捷标签 -->
      <div class="nav-section">
        <div class="section-head">
          <span class="section-title">快捷标签</span>
          <span class="section-hint">收藏时点选</span>
        </div>
        <div class="quick-chips" id="quickList"></div>
        <div class="qadd">
          <input class="input" id="quickAdd" placeholder="添加快捷标签">
          <button class="btn btn-sm" id="quickAddBtn">添加</button>
        </div>
      </div>

      <!-- 全部标签 -->
      <div class="nav-section">
        <div class="section-head">
          <span class="section-title">标签索引</span>
          <div class="seg-toggle" id="tagSortToggle" title="标签排序">
            <button data-tsort="count" class="on">频次</button>
            <button data-tsort="alpha">字母</button>
          </div>
        </div>
        <div class="tag-tools">
          <input class="input tag-search" id="tagSearch" placeholder="过滤标签...">
        </div>
        <div class="tag-mode-bar" id="tagModeBar" hidden>
          <span>多标签匹配：</span>
          <div class="seg-toggle" id="tagModeToggle">
            <button data-mode="or" class="on">OR 任一</button>
            <button data-mode="and">AND 同时</button>
          </div>
        </div>
        <div class="tag-list" id="tagList"></div>
      </div>
    </div>

    <!-- 存储与备份 -->
    <div class="sidebar-foot">
      <div class="storage-meta" id="storageMeta">
        <span>本地存储</span>
        <span id="storageText">--</span>
      </div>
      <div class="storage-bar"><div class="storage-fill" id="storageFill" style="width:0%"></div></div>
      <div class="backup-actions">
        <button class="btn btn-sm" id="exportJson">导出备份</button>
        <button class="btn btn-sm" id="importJsonBtn">导入备份</button>
        <input type="file" id="importFile" accept=".json" hidden>
      </div>
    </div>
  </aside>

  <!-- 右侧主工作区 -->
  <div class="workspace">
    <header class="topbar">
      <div class="topbar-row">
        <button class="btn btn-icon mobile-menu-btn" id="mobileMenuBtn" aria-label="展开侧栏">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="q" placeholder="搜索标题、网址、域名或书摘备注...">
          <span class="kbd-hint">/</span>
        </div>

        <div class="date-popover-wrap">
          <button class="btn" id="dateFilterBtn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span id="dateFilterLabel">全部时间</span>
          </button>
          <div class="popover-panel" id="datePopover">
            <div class="preset-grid">
              <button class="btn btn-sm" data-dp="all">全部时间</button>
              <button class="btn btn-sm" data-dp="today">今天</button>
              <button class="btn btn-sm" data-dp="7d">近 7 天</button>
              <button class="btn btn-sm" data-dp="30d">近 30 天</button>
            </div>
            <div class="custom-dates">
              <label>开始 <input type="date" id="fs"></label>
              <label>结束 <input type="date" id="fe"></label>
            </div>
          </div>
        </div>

        <select class="select-ctrl" id="sortSelect" title="排序方式">
          <option value="newest">最新收藏</option>
          <option value="oldest">最早收藏</option>
          <option value="updated">最近更新</option>
        </select>

        <button class="btn btn-icon" id="densityBtn" title="切换视图密度" aria-label="切换视图密度">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>

        <button class="btn" id="newBookmarkBtn">+ 新建</button>
        <button class="btn" id="quickCopyMdBtn" title="直接复制当前汇总到剪贴板">复制汇总</button>
        <button class="btn btn-primary" id="openExportBtn">导出 Markdown</button>
      </div>
      <div class="active-bar" id="activeBar" hidden></div>
    </header>

    <main class="feed-wrap">
      <div class="feed-summary">
        <span id="feedSummaryText">加载中...</span>
        <button class="btn btn-ghost btn-sm" id="selectAllBtn">全选当前</button>
      </div>
      <div id="list"></div>
    </main>
  </div>
</div>

<!-- 底部悬浮批量操作条 -->
<div class="batch-bar" id="batchBar">
  <span class="batch-count" id="batchCount">已选 0 项</span>
  <button class="btn btn-sm" id="batchAddTagBtn">+ 加标签</button>
  <button class="btn btn-sm" id="batchDelTagBtn">- 删标签</button>
  <button class="btn btn-sm" id="batchExportBtn">导出所选</button>
  <button class="btn btn-sm btn-danger" id="batchDeleteBtn">批量删除</button>
  <button class="btn btn-ghost btn-sm" id="batchClearBtn">取消</button>
</div>

<!-- 右侧滑出式导出抽屉 -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="exportDrawer" aria-label="导出 Markdown 汇总">
  <div class="drawer-head">
    <h2>导出 Markdown 汇总</h2>
    <button class="btn btn-ghost btn-icon" id="closeDrawerBtn" aria-label="关闭">×</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-pills" id="exportRangePills">
      <button class="btn btn-sm" data-r="today">今日</button>
      <button class="btn btn-sm" data-r="yesterday">昨日</button>
      <button class="btn btn-sm" data-r="week">本周</button>
      <button class="btn btn-sm" data-r="lastweek">上周</button>
      <button class="btn btn-sm" data-r="custom">自定义区间</button>
      <button class="btn btn-sm" data-r="current">当前筛选结果</button>
      <button class="btn btn-sm" data-r="selected">已勾选条目</button>
    </div>
    <div class="drawer-custom-range" id="drawerCustomRange" hidden>
      <input type="date" id="rs">
      <span>~</span>
      <input type="date" id="re">
    </div>
    <div class="drawer-options">
      <label><input type="checkbox" id="useFilter" checked>叠加当前列表筛选</label>
      <label><input type="checkbox" id="onlyWx">仅公众号链接</label>
    </div>
    <textarea class="textarea drawer-preview" id="preview" readonly></textarea>
  </div>
  <div class="drawer-foot">
    <span class="drawer-meta" id="exportMeta">--</span>
    <div style="display:flex;gap:8px;">
      <button class="btn" id="copy">复制 Markdown</button>
      <button class="btn btn-primary" id="dl">下载 .md</button>
    </div>
  </div>
</aside>

<!-- 模态框遮罩 -->
<div class="modal-backdrop" id="modalBackdrop"></div>

<!-- 新建 / 编辑书签弹窗 -->
<div class="modal" id="editModal" role="dialog" aria-modal="true">
  <div class="modal-head">
    <h3 id="editModalTitle">编辑书签</h3>
    <button class="btn btn-ghost btn-icon" data-close-modal aria-label="关闭">×</button>
  </div>
  <div class="modal-body">
    <div>
      <label class="field-label" for="mTitle">标题</label>
      <input class="input" id="mTitle" placeholder="网页标题">
    </div>
    <div>
      <label class="field-label" for="mUrl">网址</label>
      <input class="input" id="mUrl" placeholder="https://...">
    </div>
    <div>
      <label class="field-label" for="mTags">标签（空格或逗号分隔）</label>
      <div class="sug-wrap">
        <input class="input" id="mTags" autocomplete="off" placeholder="如：大模型 AI阅读">
        <div class="sug-list" id="mSugList"></div>
      </div>
      <div class="quick-edit-chips" id="mQuickChips"></div>
    </div>
    <div>
      <label class="field-label" for="mNote">书摘 / 备注</label>
      <textarea class="textarea" id="mNote" rows="3" placeholder="记录核心观点或阅读备注..."></textarea>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn" data-close-modal>取消</button>
    <button class="btn btn-primary" id="mSaveBtn">保存 (⌘/Ctrl+Enter)</button>
  </div>
</div>

<!-- 标签治理弹窗（重命名 / 合并 / 删除） -->
<div class="modal" id="tagModal" role="dialog" aria-modal="true">
  <div class="modal-head">
    <h3>管理标签：<span id="tmTagName"></span></h3>
    <button class="btn btn-ghost btn-icon" data-close-modal aria-label="关闭">×</button>
  </div>
  <div class="modal-body">
    <div>
      <label class="field-label" for="tmNewName">重命名或合并到其他标签</label>
      <input class="input" id="tmNewName" placeholder="输入新标签名">
    </div>
    <div class="hint-box" id="tmMergeHint" hidden></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-sm" id="tmToggleQuickBtn">加入快捷标签</button>
      <button class="btn btn-sm btn-danger" id="tmDeleteBtn">从所有书签移除此标签</button>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn" data-close-modal>关闭</button>
    <button class="btn btn-primary" id="tmRenameBtn">应用重命名</button>
  </div>
</div>

<!-- 批量增删标签弹窗 -->
<div class="modal" id="batchTagModal" role="dialog" aria-modal="true">
  <div class="modal-head">
    <h3 id="btTitle">批量添加标签</h3>
    <button class="btn btn-ghost btn-icon" data-close-modal aria-label="关闭">×</button>
  </div>
  <div class="modal-body">
    <div>
      <label class="field-label" for="btInput">输入标签（空格或逗号分隔）</label>
      <input class="input" id="btInput" placeholder="如：深度阅读 待整理">
    </div>
    <div class="quick-edit-chips" id="btQuickChips"></div>
  </div>
  <div class="modal-foot">
    <button class="btn" data-close-modal>取消</button>
    <button class="btn btn-primary" id="btConfirmBtn">确定</button>
  </div>
</div>

<!-- Toast 容器 -->
<div class="toast-host" id="toastHost"></div>

<script src="store.js"></script>
<script src="digest.js"></script>
<script src="manage.js"></script>
</body>
</html>

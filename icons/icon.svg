<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- 整体圆角底板裁剪 -->
    <clipPath id="squircle">
      <rect x="4" y="4" width="120" height="120" rx="28" ry="28"/>
    </clipPath>

    <!-- 四宫格渐变（致敬 del.icio.us 2x2 基因 + 暖纸知识库配色） -->
    <linearGradient id="tlGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#EDE7DA"/>
    </linearGradient>
    <linearGradient id="trGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="blGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B2925"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>
    <linearGradient id="brGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- 中央书签丝带投影 -->
    <filter id="ribbonShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F0E0C" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 四宫格底板 -->
  <g clip-path="url(#squircle)">
    <rect x="4" y="4" width="60" height="60" fill="url(#tlGrad)"/>
    <rect x="64" y="4" width="60" height="60" fill="url(#trGrad)"/>
    <rect x="4" y="64" width="60" height="60" fill="url(#blGrad)"/>
    <rect x="64" y="64" width="60" height="60" fill="url(#brGrad)"/>

    <!-- 细微十字分隔高光 -->
    <line x1="64" y1="4" x2="64" y2="124" stroke="#000" stroke-opacity="0.08" stroke-width="1"/>
    <line x1="4" y1="64" x2="124" y2="64" stroke="#000" stroke-opacity="0.08" stroke-width="1"/>
  </g>

  <!-- 精致外框内描边 -->
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" ry="27.25"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- 中央浮雕纯白书签丝带（带顶部穿孔） -->
  <g filter="url(#ribbonShadow)">
    <path d="M48 26
             H80
             A6 6 0 0 1 86 32
             V98.5
             A3 3 0 0 1 81.3 101
             L65.8 89.2
             A3 3 0 0 0 62.2 89.2
             L46.7 101
             A3 3 0 0 1 42 98.5
             V32
             A6 6 0 0 1 48 26 Z"
          fill="#FFFDF9"/>
    <!-- 书签穿孔 -->
    <circle cx="64" cy="44" r="5.5" fill="#1D4ED8"/>
    <circle cx="64" cy="44" r="5.5" fill="none" stroke="#1E40AF" stroke-opacity="0.25" stroke-width="1"/>
  </g>
</svg>
